

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>真心話大冒險</title>
    <style>
        /* ====== 基本與共用樣式 ====== */
        :root {
            --bg-color: #f0f4f8;
            --bg-gradient: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
            --text-color: #2c3e50;
            --btn-truth-bg: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --btn-dare-bg: linear-gradient(135deg, #FF416C 0%, #FF4B2B 100%);
            --btn-text: white;
            --card-bg: rgba(255, 255, 255, 0.92);
            --card-shadow: 0 15px 35px rgba(50, 50, 93, 0.1), 0 5px 15px rgba(0, 0, 0, 0.07);
            --font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            --accent-color: #6c5ce7;
            --svg-float-color: rgba(108, 92, 231, 0.15);
        }

        /* 限制級 (霓虹派對) 變數替換 */
        body.theme-r18 {
            --bg-color: #0d0814;
            --bg-gradient: radial-gradient(circle at center, #1f0a33 0%, #08030d 100%);
            --text-color: #fff;
            --btn-truth-bg: transparent;
            --btn-dare-bg: transparent;
            --card-bg: rgba(20, 10, 30, 0.88);
            --card-shadow: 0 0 25px rgba(255, 0, 255, 0.25), inset 0 0 15px rgba(255, 0, 255, 0.1);
            --accent-color: #ff00ff;
            --svg-float-color: rgba(255, 0, 255, 0.2);
        }

        body {
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-color);
            font-family: var(--font-family);
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
            position: relative;
            overflow-x: hidden;
            transition: background 0.6s ease, color 0.6s ease;
        }

        /* ====== 背景動態飄浮插畫 ====== */
        .bg-decorations {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none; z-index: 0; overflow: hidden;
        }

        .floating-icon {
            position: absolute; fill: var(--svg-float-color);
            animation: float 8s infinite ease-in-out;
            transition: fill 0.5s ease;
        }

        .icon-1 { top: 10%; left: 8%; width: 60px; animation-delay: 0s; }
        .icon-2 { top: 70%; left: 12%; width: 50px; animation-delay: 2s; }
        .icon-3 { top: 15%; right: 10%; width: 70px; animation-delay: 4s; }
        .icon-4 { top: 75%; right: 8%; width: 55px; animation-delay: 1s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(12deg); }
        }

        /* ====== 核心容器 ====== */
        .container {
            position: relative;
            z-index: 1;
            width: 90%;
            max-width: 480px;
            text-align: center;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            padding: 35px 25px;
            border-radius: 24px;
            box-shadow: var(--card-shadow);
            border: 1px solid rgba(255, 255, 255, 0.3);
            transition: all 0.5s ease;
        }

        body.theme-r18 .container { border: 1px solid rgba(255, 0, 255, 0.4); }

        /* ====== 背景音樂開關按鈕 ====== */
        .bgm-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.06);
            border: 1px solid rgba(0, 0, 0, 0.1);
            border-radius: 20px;
            padding: 6px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            color: var(--text-color);
            transition: all 0.3s;
            z-index: 10;
        }
        .bgm-toggle:hover { background: rgba(0, 0, 0, 0.12); transform: scale(1.05); }
        body.theme-r18 .bgm-toggle {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 0, 255, 0.3);
        }

        h1 { font-size: 2rem; margin: 10px 0 5px; }
        h2 { font-size: 1.5rem; margin-bottom: 20px; }
        p { opacity: 0.85; margin-bottom: 25px; font-size: 0.95rem; }

        .hero-illustration { width: 100px; height: 100px; margin: 0 auto 10px; display: block; }

        /* ====== 按鈕設計 ====== */
        button {
            font-size: 1.1rem;
            padding: 14px 28px;
            margin: 8px 0;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: var(--btn-text);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        button:hover { transform: translateY(-3px); box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2); }
        button:active { transform: translateY(1px); }

        .btn-normal { background: linear-gradient(135deg, #42a5f5, #1e88e5); width: 100%; }
        .btn-r18 { background: linear-gradient(135deg, #ab47bc, #7b1fa2); width: 100%; }
        .btn-truth { background: var(--btn-truth-bg); }
        .btn-dare { background: var(--btn-dare-bg); }
        .btn-action { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); width: 100%; }

        .btn-sub { 
            background: rgba(120, 144, 156, 0.15); 
            color: var(--text-color);
            font-size: 0.85rem; 
            padding: 8px 18px; 
            margin: 4px;
            border: 1px solid rgba(150, 150, 150, 0.3);
            box-shadow: none;
        }
        .btn-sub:hover { background: rgba(120, 144, 156, 0.25); }

        .btn-disabled { 
            background: #ccc !important; 
            cursor: not-allowed !important; 
            box-shadow: none !important; 
            transform: none !important;
            opacity: 0.6;
        }

        /* 限制級 (霓虹版按鈕邊框與發光) */
        body.theme-r18 .btn-truth {
            border: 2px solid #ff00ff; color: #ff00ff;
            box-shadow: 0 0 12px #ff00ff, inset 0 0 12px #ff00ff; text-shadow: 0 0 8px #ff00ff;
        }
        body.theme-r18 .btn-dare {
            border: 2px solid #00ffff; color: #00ffff;
            box-shadow: 0 0 12px #00ffff, inset 0 0 12px #00ffff; text-shadow: 0 0 8px #00ffff;
        }
        body.theme-r18 .btn-action {
            border: 2px solid #ffeb3b; color: #ffeb3b; background: transparent;
            box-shadow: 0 0 12px #ffeb3b; text-shadow: 0 0 5px #ffeb3b;
        }
        body.theme-r18 .btn-sub { border-color: rgba(255, 255, 255, 0.3); color: #ccc; }

        .screen { display: none; }
        .screen.active { display: block; animation: fadeIn 0.4s ease-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .input-group { margin: 18px 0; text-align: left; }
        .input-group label { font-size: 0.9rem; font-weight: bold; display: block; margin-bottom: 6px; }
        input[type="text"], input[type="number"], select {
            padding: 12px 15px; width: 100%; border-radius: 12px;
            border: 2px solid #e0e0e0; font-size: 1rem; box-sizing: border-box; outline: none;
            background: white; color: #333;
        }
        input:focus, select:focus { border-color: var(--accent-color); }
        body.theme-r18 input, body.theme-r18 select { background: #1a1a24; color: white; border-color: #332a45; }
        
        .player-list { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin: 15px 0; }
        .player-tag { 
            background: var(--accent-color); color: white; padding: 6px 16px; 
            border-radius: 20px; font-size: 0.85rem; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .question-box-wrapper {
            background: rgba(0,0,0,0.03); border-radius: 18px; padding: 20px; margin: 20px 0;
            border: 1px dashed rgba(0,0,0,0.15); position: relative;
        }
        body.theme-r18 .question-box-wrapper { background: rgba(255,255,255,0.03); border-color: rgba(255,255,255,0.15); }

        .question-box {
            font-size: 1.5rem; min-height: 110px; display: flex;
            align-items: center; justify-content: center; font-weight: bold; line-height: 1.4;
        }
        body.theme-r18 .question-box { text-shadow: 0 0 12px rgba(255,255,255,0.6); }

        .result-illustration { width: 60px; height: 60px; margin-bottom: 10px; }
        .player-turn { font-size: 1.3rem; color: #ff5722; font-weight: bold; margin-bottom: 5px; }
        body.theme-r18 .player-turn { color: #ffeb3b; text-shadow: 0 0 8px #ffeb3b; }
        .regret-status { font-size: 0.85rem; margin-bottom: 20px; opacity: 0.75; }

        /* ====== 題庫管理頁專用樣式 ====== */
        .manage-controls {
            display: flex; gap: 8px; margin-bottom: 15px;
        }
        .q-list-container {
            max-height: 220px;
            overflow-y: auto;
            border: 1px solid rgba(150, 150, 150, 0.2);
            border-radius: 12px;
            padding: 8px;
            background: rgba(0,0,0,0.02);
            margin-bottom: 15px;
            text-align: left;
        }
        body.theme-r18 .q-list-container { background: rgba(255,255,255,0.02); }
        .q-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            margin-bottom: 6px;
            background: rgba(255,255,255,0.7);
            border-radius: 8px;
            font-size: 0.9rem;
            word-break: break-all;
        }
        body.theme-r18 .q-item { background: rgba(255,255,255,0.1); color: #fff; }
        .q-del-btn {
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 6px;
            padding: 4px 10px;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: none;
            margin: 0 0 0 8px;
            flex-shrink: 0;
        }
        .q-del-btn:hover { background: #ff6b81; transform: none; }

        .nav-footer {
            margin-top: 25px; padding-top: 15px;
            border-top: 1px solid rgba(150, 150, 150, 0.2);
            display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
        }
    </style>
</head>
<body>

    <!-- ====== 背景飄浮 SVG 插畫 ====== -->
    <div class="bg-decorations">
        <svg class="floating-icon icon-1" viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM7 7c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm0 10c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm5-5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm5 5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm0-10c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
        <svg class="floating-icon icon-2" viewBox="0 0 24 24"><path d="M13.5 1.5c0 0-2.5 3.5-2.5 6.5 0 .7.1 1.4.3 2.1-1.2-.8-2.3-2.1-2.3-4.1 0 0-4.5 3.5-4.5 8.5 0 4.4 3.6 8 8 8s8-3.6 8-8c0-5.5-7-13-7-13zm-1.5 19.5c-2.2 0-4-1.8-4-4 0-1.5 1.2-3.3 2.3-4.3.4 1.2 1.4 2.3 2.7 2.3 1.7 0 3-1.3 3-3 0 2.8-1.8 5-4 5z"/></svg>
        <svg class="floating-icon icon-3" viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-1.99.9-1.99 2L2 22l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 12h-2v-2h2v2zm0-4h-2V6h2v4z"/></svg>
        <svg class="floating-icon icon-4" viewBox="0 0 24 24"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>
    </div>

    <!-- ====== 主遊戲容器 ====== -->
    <div class="container">
        
        <!-- 背景音樂控制鈕 -->
        <button class="bgm-toggle" onclick="toggleBGM()" id="bgm-btn">
            <span id="bgm-icon">🎵</span> <span id="bgm-text">配樂：開</span>
        </button>

        <!-- 場景一：選擇模式 (首頁) -->
        <div id="screen-lobby" class="screen active">
            <svg class="hero-illustration" viewBox="0 0 100 100">
                <circle cx="50" cy="50" r="45" fill="#6c5ce7" opacity="0.15"/>
                <path d="M30,65 Q50,80 70,65" stroke="#6c5ce7" stroke-width="5" fill="none" stroke-linecap="round"/>
                <path d="M25,40 L35,45 L25,50 Z" fill="#ff7675"/>
                <path d="M75,40 L65,45 L75,50 Z" fill="#74b9ff"/>
                <circle cx="38" cy="38" r="6" fill="#2d3436"/>
                <circle cx="62" cy="38" r="6" fill="#2d3436"/>
                <polygon points="50,15 58,30 42,30" fill="#fdcb6e"/>
            </svg>

            <h1>🎭 真心話大冒險</h1>
            <p>準備好揭開秘密或接受挑戰了嗎？</p>
            
            <button class="btn-normal" onclick="selectTheme('normal')">✨ 普通級 (歡樂派對)</button><br>
            <button class="btn-r18" onclick="selectTheme('r18')">🔥 限制級 (深夜霓虹)</button>
        </div>

        <!-- 場景二：遊戲設定 -->
        <div id="screen-settings" class="screen">
            <h2>⚙️ 遊戲設定</h2>
            
            <div class="input-group">
                <label>每人可反悔 (換題) 次數：</label>
                <input type="number" id="setting-regrets" value="1" min="0" max="10">
            </div>

            <div class="input-group">
                <label>玩家名字 (選填，留空則為自由模式)</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="player-input" placeholder="輸入名字" onkeypress="if(event.key === 'Enter') addPlayer()">
                    <button class="btn-action" style="width: auto; padding: 0 20px; font-size: 0.95rem;" onclick="addPlayer()">新增</button>
                </div>
            </div>
            
            <div class="player-list" id="player-list-display"></div>

            <button class="btn-action" style="margin-top: 10px;" onclick="startGame()">🚀 開始遊戲！</button>
            <button class="btn-sub" style="width: 100%; margin-top: 5px; padding: 10px;" onclick="goToManageQuestions()">✏️ 編輯 / 自訂題庫</button>

            <div class="nav-footer">
                <button class="btn-sub" onclick="goToLobby()">🏠 回到首頁</button>
            </div>
        </div>

        <!-- 場景三：主遊戲畫面 -->
        <div id="screen-game" class="screen">
            <div id="turn-display" class="player-turn">自由抽題模式</div>
            <div id="regret-display" class="regret-status"></div>
            
            <button class="btn-truth" style="width: 100%; height: 75px; font-size: 1.4rem; margin-bottom: 12px;" onclick="drawQuestion('truth')">
                🤔 真 心 話
            </button>
            <button class="btn-dare" style="width: 100%; height: 75px; font-size: 1.4rem;" onclick="drawQuestion('dare')">
                🔥 大 冒 險
            </button>

            <div class="nav-footer">
                <button class="btn-sub" onclick="goToSettings()">⚙️ 重新設定</button>
                <button class="btn-sub" onclick="goToManageQuestions()">✏️ 題庫</button>
                <button class="btn-sub" onclick="goToLobby()">🏠 回到首頁</button>
            </div>
        </div>

        <!-- 場景四：抽題與結果畫面 -->
        <div id="screen-result" class="screen">
            <div id="result-illustration-container"></div>
            <h3 id="result-type" style="margin: 5px 0; font-size: 1.3rem;"></h3>
            
            <div class="question-box-wrapper">
                <div class="question-box" id="question-text">準備中...</div>
            </div>
            
            <div id="result-actions" style="display: none;">
                <button id="btn-regret" class="btn-action" onclick="useRegret()">換一題 (扣1次反悔)</button><br>
                <button class="btn-action" style="background: var(--btn-truth-bg);" onclick="nextTurn()">完成</button>
            </div>

            <div class="nav-footer">
                <button class="btn-sub" onclick="goToSettings()">⚙️ 重新設定</button>
                <button class="btn-sub" onclick="goToLobby()">🏠 回到首頁</button>
            </div>
        </div>

        <!-- 場景五：題庫管理畫面 -->
        <div id="screen-manage" class="screen">
            <h2>✏️ 題庫管理</h2>
            
            <div class="manage-controls">
                <select id="manage-theme-select" onchange="renderQuestionManager()">
                    <option value="normal">✨ 普通級</option>
                    <option value="r18">🔥 限制級</option>
                </select>
                <select id="manage-type-select" onchange="renderQuestionManager()">
                    <option value="truth">🤔 真心話</option>
                    <option value="dare">🔥 大冒險</option>
                </select>
            </div>

            <div class="input-group" style="margin: 10px 0;">
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="new-question-input" placeholder="新增自訂題目..." onkeypress="if(event.key === 'Enter') addCustomQuestion()">
                    <button class="btn-action" style="width: auto; padding: 0 18px; font-size: 0.9rem;" onclick="addCustomQuestion()">新增</button>
                </div>
            </div>

            <!-- 題目清單 -->
            <div class="q-list-container" id="question-list-display"></div>

            <div style="display: flex; gap: 8px; justify-content: center; margin-top: 10px;">
                <button class="btn-sub" style="color: #ff4757; border-color: rgba(255, 71, 87, 0.4);" onclick="resetDefaultQuestions()">🔄 恢復預設題庫</button>
                <button class="btn-sub" onclick="backFromManage()">← 返回</button>
            </div>
        </div>

    </div>

    <!-- ====== 遊戲邏輯、題庫與配樂引擎 ====== -->
    <script>
        // 預設預備題庫
        const defaultQuestionBanks = {
            normal: {
                truth: [
                    "你最後一次哭是什麼時候？因為什麼事？",
                    "在場的人當中，你覺得誰最有可能成為富翁？",
                    "分享一個你小時候做的最蠢的夢想。",
                    "如果你有一台時光機，你想回到哪一天？",
                    "說出你手機裡最常用的一個 APP，並展示最近使用的紀錄。",
                    "你有沒有什麼不為人知的小怪癖？",
                    "在場的人當中，你對誰的第一印象和現在差最多？",
                    "你最害怕什麼動物或昆蟲？為什麼？",
                    "說出一件你曾經瞞著父母做過最誇張的事。",
                    "如果你中了一億彩券，你第一件要做的事情是什麼？"
                ],
                dare: [
                    "用屁股寫自己的名字。",
                    "模仿在場某一個人的招牌動作，讓大家猜是誰。",
                    "選定在場一位異性（或同性），深情對視 10 秒鐘不能笑。",
                    "對著牆壁深情告白 1 分鐘。",
                    "原地轉 10 圈，然後走直線到對面。",
                    "用最性感的聲音念出一句廣告台詞。",
                    "讓在場的某個人用奇異筆在你臉上畫一個圖案。",
                    "唱一首兒歌，但是要用悲傷的語氣唱。",
                    "接下來的 3 輪遊戲中，你講話都必須用外星語（或疊字）結尾。",
                    "做 15 個波比跳（或伏地挺身）。"
                ]
            },
            r18: {
                truth: [
                    "你最瘋狂的一次性經驗在哪裡發生？",
                    "在場的人當中，誰最符合你的性幻想對象？",
                    "你有沒有看過在場某人的身體（或不小心看到）？",
                    "說出你身體最敏感的三個部位。",
                    "你有沒有發生過一夜情？感覺如何？",
                    "你買過最奇怪的情趣用品是什麼？",
                    "曾經有過同時跟兩個人以上曖昧或交往嗎？",
                    "你做過最色情的一個夢，夢裡的對象是誰？",
                    "你覺得自己的床上功夫有幾分（滿分10分）？",
                    "有沒有曾經在公共場合偷偷親熱的經驗？在哪裡？"
                ],
                dare: [
                    "舔在場某個人的鎖骨（或手背）。",
                    "挑選在場一個人，坐在他/她的大腿上直到下一回合結束。",
                    "與指定對象十指緊扣 3 分鐘。",
                    "蒙上眼睛，讓大家拿一種食物餵你吃，你要猜出是什麼。",
                    "讓在場的一個人檢查你手機的相簿，並選一張照片大聲描述。",
                    "脫掉身上的一件衣物（配件不算），直到遊戲結束。",
                    "對著在場某個人，在他的耳邊吹氣並輕聲說一句挑逗的話。",
                    "與在場某人安全之吻（隔著衛生紙親嘴）。",
                    "表演一段 30 秒的性感熱舞。",
                    "讓大家看你手機瀏覽器的無痕搜尋紀錄（或搜尋歷史）。"
                ]
            }
        };

        // 從 LocalStorage 載入玩家題庫，否則使用預設值
        let questionBanks = JSON.parse(localStorage.getItem('truth_or_dare_questions')) || JSON.parse(JSON.stringify(defaultQuestionBanks));

        function saveQuestions() {
            try {
                localStorage.setItem('truth_or_dare_questions', JSON.stringify(questionBanks));
            } catch(e) {}
        }

        const illustrations = {
            truth: `<svg class="result-illustration" viewBox="0 0 24 24" fill="none" stroke="#38ef7d" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`,
            dare: `<svg class="result-illustration" viewBox="0 0 24 24" fill="none" stroke="#FF416C" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>`
        };

        let currentTheme = 'normal';
        let previousScreen = 'settings';
        let players = [];
        let maxRegrets = 1;
        let currentPlayerIndex = -1;
        let currentDrawType = '';
        let isFreeMode = true;

        /* ====== Web Audio API 聲效與背景音樂引擎 ====== */
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        let bgmInterval = null;
        let bgmStep = 0;
        let isBgmOn = true;

        function playTone(frequency, type, duration, vol = 0.1) {
            try {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = type;
                oscillator.frequency.value = frequency;
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                gainNode.gain.setValueAtTime(vol, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
                oscillator.stop(audioCtx.currentTime + duration);
            } catch (e) {}
        }
        function playBeep() { playTone(600, 'square', 0.05, 0.05); }
        function playDing() { playTone(1200, 'sine', 0.6, 0.2); }

        const bgmNotes = {
            normal: [261.63, 329.63, 392.00, 523.25, 392.00, 329.63, 349.23, 440.00],
            r18: [110.00, 110.00, 130.81, 110.00, 146.83, 110.00, 130.81, 98.00]
        };

        function startBGM() {
            if (!isBgmOn || bgmInterval) return;
            bgmStep = 0;
            const speed = currentTheme === 'r18' ? 220 : 280;

            bgmInterval = setInterval(() => {
                if (!isBgmOn) return;
                try {
                    if(audioCtx.state === 'suspended') audioCtx.resume();
                    const notes = bgmNotes[currentTheme];
                    const freq = notes[bgmStep % notes.length];
                    const waveType = currentTheme === 'r18' ? 'sawtooth' : 'sine';
                    const volume = currentTheme === 'r18' ? 0.03 : 0.02;

                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = waveType;
                    osc.frequency.value = freq;
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start();
                    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
                    osc.stop(audioCtx.currentTime + 0.2);

                    bgmStep++;
                } catch(e) {}
            }, speed);
        }

        function stopBGM() {
            if (bgmInterval) {
                clearInterval(bgmInterval);
                bgmInterval = null;
            }
        }

        function toggleBGM() {
            isBgmOn = !isBgmOn;
            const icon = document.getElementById('bgm-icon');
            const text = document.getElementById('bgm-text');
            if (isBgmOn) {
                icon.innerText = "🎵";
                text.innerText = "配樂：開";
                startBGM();
            } else {
                icon.innerText = "🔇";
                text.innerText = "配樂：關";
                stopBGM();
            }
        }

        /* ====== UI 與畫面控制 ====== */
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
            document.getElementById('screen-' + screenId).classList.add('active');
        }

        function selectTheme(theme) {
            currentTheme = theme;
            document.body.className = theme === 'r18' ? 'theme-r18' : 'theme-normal';
            stopBGM();
            startBGM();
            showScreen('settings');
        }

        function goToLobby() {
            const currentActiveScreen = document.querySelector('.screen.active').id;
            if (currentActiveScreen === 'screen-game' || currentActiveScreen === 'screen-result') {
                if (!confirm("確定要回到首頁嗎？這將重置遊戲進度。")) return;
            }
            players = [];
            currentPlayerIndex = -1;
            document.getElementById('player-list-display').innerHTML = '';
            document.getElementById('player-input').value = '';
            document.body.className = '';
            stopBGM();
            showScreen('lobby');
        }

        function goToSettings() { showScreen('settings'); }

        /* ====== 題庫管理邏輯 ====== */
        function goToManageQuestions() {
            previousScreen = document.querySelector('.screen.active').id.replace('screen-', '');
            document.getElementById('manage-theme-select').value = currentTheme;
            renderQuestionManager();
            showScreen('manage');
        }

        function backFromManage() {
            showScreen(previousScreen || 'settings');
        }

        function renderQuestionManager() {
            const theme = document.getElementById('manage-theme-select').value;
            const type = document.getElementById('manage-type-select').value;
            const container = document.getElementById('question-list-display');
            const list = questionBanks[theme][type] || [];

            if (list.length === 0) {
                container.innerHTML = `<div style="text-align:center; padding: 20px; opacity:0.6;">目前沒有任何題目，請新增！</div>`;
                return;
            }

            container.innerHTML = list.map((q, idx) => `
                <div class="q-item">
                    <span>${idx + 1}. ${q}</span>
                    <button class="q-del-btn" onclick="deleteCustomQuestion(${idx})">刪除</button>
                </div>
            `).join('');
        }

        function addCustomQuestion() {
            const input = document.getElementById('new-question-input');
            const text = input.value.trim();
            if (!text) return;

            const theme = document.getElementById('manage-theme-select').value;
            const type = document.getElementById('manage-type-select').value;

            questionBanks[theme][type].push(text);
            saveQuestions();
            input.value = '';
            renderQuestionManager();
        }

        function deleteCustomQuestion(index) {
            const theme = document.getElementById('manage-theme-select').value;
            const type = document.getElementById('manage-type-select').value;

            questionBanks[theme][type].splice(index, 1);
            saveQuestions();
            renderQuestionManager();
        }

        function resetDefaultQuestions() {
            if (confirm("確定要將所有題庫恢復成初始預設值嗎？自訂題目將會被清除。")) {
                questionBanks = JSON.parse(JSON.stringify(defaultQuestionBanks));
                saveQuestions();
                renderQuestionManager();
            }
        }

        /* ====== 遊戲流程 ====== */
        function addPlayer() {
            const input = document.getElementById('player-input');
            const name = input.value.trim();
            if (name) {
                players.push({ name: name, regrets: parseInt(document.getElementById('setting-regrets').value) || 0 });
                updatePlayerListDisplay();
                input.value = '';
            }
        }

        function updatePlayerListDisplay() {
            const list = document.getElementById('player-list-display');
            list.innerHTML = players.map(p => `<span class="player-tag">${p.name}</span>`).join('');
        }

        function startGame() {
            maxRegrets = parseInt(document.getElementById('setting-regrets').value) || 0;
            
            if (players.length > 0) {
                isFreeMode = false;
                players.forEach(p => p.regrets = maxRegrets);
                currentPlayerIndex = 0;
            } else {
                isFreeMode = true;
            }

            if(audioCtx.state === 'suspended') audioCtx.resume();
            startBGM();
            updateTurnDisplay();
            showScreen('game');
        }

        function updateTurnDisplay() {
            const turnDisplay = document.getElementById('turn-display');
            const regretDisplay = document.getElementById('regret-display');

            if (isFreeMode) {
                turnDisplay.innerText = "🎲 自由抽題模式";
                regretDisplay.innerText = `單次抽題可反悔：${maxRegrets} 次`;
                window.currentFreeRegrets = maxRegrets; 
            } else {
                const p = players[currentPlayerIndex];
                turnDisplay.innerText = `👤 現在輪到：${p.name}`;
                regretDisplay.innerText = `剩餘反悔機會：${p.regrets} 次`;
            }
        }

        function drawQuestion(type, isRegret = false) {
            currentDrawType = type;
            const bank = questionBanks[currentTheme][type];
            if (!bank || bank.length === 0) {
                alert("這個題庫目前沒有任何題目，請先至「題庫管理」新增！");
                return;
            }

            const randomIndex = Math.floor(Math.random() * bank.length);
            const finalQuestion = bank[randomIndex];

            document.getElementById('result-illustration-container').innerHTML = illustrations[type];
            document.getElementById('result-type').innerText = type === 'truth' ? "🤔 真心話" : "🔥 大冒險";
            document.getElementById('result-actions').style.display = "none";
            showScreen('result');

            animateText(finalQuestion, bank);
        }

        function animateText(finalText, bank) {
            const qBox = document.getElementById('question-text');
            let counter = 0;
            const maxTicks = 15;
            const intervalTime = 80;

            const shuffle = setInterval(() => {
                qBox.innerText = bank[Math.floor(Math.random() * bank.length)];
                playBeep();
                
                counter++;
                if (counter >= maxTicks) {
                    clearInterval(shuffle);
                    qBox.innerText = finalText;
                    playDing();
                    setupResultActions();
                }
            }, intervalTime);
        }

        function setupResultActions() {
            document.getElementById('result-actions').style.display = "block";
            const btnRegret = document.getElementById('btn-regret');
            
            let regretsLeft = isFreeMode ? window.currentFreeRegrets : players[currentPlayerIndex].regrets;

            if (regretsLeft > 0) {
                btnRegret.innerText = `換一題 (剩餘 ${regretsLeft} 次反悔)`;
                btnRegret.classList.remove('btn-disabled');
                btnRegret.disabled = false;
            } else {
                btnRegret.innerText = "無法反悔，請接受挑戰！";
                btnRegret.classList.add('btn-disabled');
                btnRegret.disabled = true;
            }
        }

        function useRegret() {
            if (isFreeMode) {
                if (window.currentFreeRegrets > 0) {
                    window.currentFreeRegrets--;
                    drawQuestion(currentDrawType, true);
                }
            } else {
                if (players[currentPlayerIndex].regrets > 0) {
                    players[currentPlayerIndex].regrets--;
                    drawQuestion(currentDrawType, true);
                }
            }
        }

        function nextTurn() {
            if (!isFreeMode) {
                currentPlayerIndex = (currentPlayerIndex + 1) % players.length;
            }
            updateTurnDisplay();
            showScreen('game');
        }
    </script>
</body>
</html>
